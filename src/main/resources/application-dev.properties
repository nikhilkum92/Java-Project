# =============================================
# CampusGrid - DEV Profile (H2 In-Memory DB)
# =============================================

# Server
server.port=8080
server.servlet.context-path=/

# H2 In-Memory Database
spring.datasource.url=jdbc:h2:mem:campusgriddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL;NON_KEYWORDS=USER
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# H2 Console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT
campusgrid.jwt.secret=DevSecretKeyForCampusGridApplicationMustBe32BytesLong2026SecureDev
campusgrid.jwt.access-token-expiration-ms=900000
campusgrid.jwt.refresh-token-expiration-ms=604800000

# Static Resources
spring.web.resources.static-locations=classpath:/static/
