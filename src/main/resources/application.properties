# Server Configuration
server.port=8080
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/campusgrid?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Valt@root@123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
# Set CAMPUSGRID_JWT_SECRET environment variable in production or local development (min 32 chars / 256 bits)
campusgrid.jwt.secret=${CAMPUSGRID_JWT_SECRET:CampusGridDefaultDevelopmentSecretKey2026MustBeAtLeast32BytesLong}
campusgrid.jwt.access-token-expiration-ms=900000
campusgrid.jwt.refresh-token-expiration-ms=604800000

# Static Resources
spring.web.resources.static-locations=classpath:/static/
