# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/

# MySQL Database Configuration (Compatible with Railway & Local)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:campusgrid}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:Valt@root@123}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Security Configuration
# Set CAMPUSGRID_JWT_SECRET environment variable in production or local development (min 32 chars / 256 bits)
campusgrid.jwt.secret=${CAMPUSGRID_JWT_SECRET:CampusGridDefaultDevelopmentSecretKey2026MustBeAtLeast32BytesLong}
campusgrid.jwt.access-token-expiration-ms=900000
campusgrid.jwt.refresh-token-expiration-ms=604800000

# Static Resources
spring.web.resources.static-locations=classpath:/static/
